version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
    ELASTIC_IP: 13.205.239.68

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY
      - TAG=$(echo $CODEBUILD_RESOLVED_SOURCE_VERSION | cut -c1-7)
      - echo "Building tag $TAG"
  build:
    commands:
      - docker build -t $REGISTRY/todo-app-server:$TAG -t $REGISTRY/todo-app-server:latest ./server
      - docker build --build-arg VITE_API_URL=http://$ELASTIC_IP -t $REGISTRY/todo-app-client:$TAG -t $REGISTRY/todo-app-client:latest .
  post_build:
    commands:
      - docker push $REGISTRY/todo-app-server:$TAG
      - docker push $REGISTRY/todo-app-server:latest
      - docker push $REGISTRY/todo-app-client:$TAG
      - docker push $REGISTRY/todo-app-client:latest

artifacts:
  files:
    - docker-compose.yml
    - server/migrations/**/*