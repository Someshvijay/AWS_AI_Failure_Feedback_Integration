services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: todo_user
      POSTGRES_PASSWORD: todo_pass
      POSTGRES_DB: todoapp
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./server/migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U todo_user -d todoapp"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    image: 782624259096.dkr.ecr.ap-south-1.amazonaws.com/todo-app-server:latest
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - ./server/.env.docker
    depends_on:
      db:
        condition: service_healthy

  client:
    image: 782624259096.dkr.ecr.ap-south-1.amazonaws.com/todo-app-client:latest
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  pgdata: