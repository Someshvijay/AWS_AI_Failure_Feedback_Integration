version: 0.2

env:
  variables:
    AWS_REGION: ap-south-1
  parameter-store:
    INSTANCE_ID: /todo-app-aws/instance-id

phases:
  pre_build:
    commands:
      - ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
      - REGISTRY="$ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
      - aws s3 cp docker-compose.yml s3://$ARTIFACT_BUCKET/deploy/docker-compose.yml
  build:
    commands:
      - |
        CMD_ID=$(aws ssm send-command \
          --instance-ids "$INSTANCE_ID" \
          --document-name "AWS-RunShellScript" \
          --comment "CodePipeline deploy" \
          --parameters commands="[
            'set -e',
            'cd /home/ubuntu/todo-app',
            'aws s3 cp s3://$ARTIFACT_BUCKET/deploy/docker-compose.yml docker-compose.yml',
            'aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $REGISTRY',
            'docker compose pull',
            'docker compose up -d',
            'docker image prune -f',
            'sleep 20',
            'docker compose ps',
            'curl -sf http://localhost:3000/api/todos > /dev/null || (docker compose logs --tail=50 && exit 1)'
          ]" \
          --query 'Command.CommandId' --output text)
      - echo "SSM command $CMD_ID"
      - aws ssm wait command-executed --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" || true
  post_build:
    commands:
      - |
        aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
          --query '[Status,StandardOutputContent,StandardErrorContent]' --output text
      - |
        STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" --query Status --output text)
        echo "Deploy status: $STATUS"
        [ "$STATUS" = "Success" ] || exit 1